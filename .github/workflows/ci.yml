name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # The keyboard layout probe calls user32, so the unit tests need Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test tests/snipv.Tests --logger "console;verbosity=normal"
